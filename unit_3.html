<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracy Craft in order with photos</title>
    <style>
        body { text-align: center; }
        .photo-set { display: none; }
        .small-phone { display: block; }
        img { width: 200px; height: 200px; object-fit: cover; }

        @media (min-width: 321px) {
            .small-phone { display: none; }
            .normal-phone { display: block; }
        }

        @media (min-width: 426px) {
            .normal-phone { display: none; }
            .tablet { display: block; }
        }

        @media (min-width: 769px) {
            .tablet { display: none; }
            .large-screen { display: block; }
        }
    </style>
</head>
<body>
    <main>
        <section class="photo-set small-phone">
            <img src="images/img1.JPG" alt="Democracy craft photo 1">
            <img src="images/img2.PNG" alt="Democracy craft photo 2">
            <img src="images/img3.JPG" alt="Democracy craft photo 3">
            <p>first week</p>
        </section>
        <section class="photo-set normal-phone">
            <img src="images/img4.jpeg" alt="Democracy craft photo 4">
            <img src="images/img5.jpeg" alt="Democracy craft photo 5">
            <img src="images/img6.PNG" alt="Democracy craft photo 6">
            <p>friends wedding and started running</p>
        </section>
        <section class="photo-set tablet">
            <img src="images/img7.PNG" alt="Democracy craft photo 7">
            <img src="images/img8.PNG" alt="Democracy craft photo 8">
            <img src="images/img9.JPG" alt="Democracy craft photo 9">
            <p>Won election with 3rd most highest votes and the second strike started</p>
        </section>
        <section class="photo-set large-screen">
            <img src="images/img10.PNG" alt="Democracy craft photo 10">
            <img src="images/img11.PNG" alt="Democracy craft photo 11">
            <img src="images/img12.PNG" alt="Democracy craft photo 12">
            <p>Whats happening now:D</p>
        </section>
    </main>
    <footer>&copy; 2026 Kayleigh Harper</footer>
</body>
</html>
